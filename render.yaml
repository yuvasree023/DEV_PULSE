services:
  - type: web
    name: devpulse-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_PRECOMPUTED
        value: "true"
      - key: PERSISTENT_DISK
        value: "false"
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://devpulse-app-snowy.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: "https://devpulse-app-snowy.vercel.app"
      - key: GITHUB_CLIENT_ID
        value: "Ov23liIkuAXGqJSzt37P"
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: "https://devpulse-app-snowy.vercel.app/login"
