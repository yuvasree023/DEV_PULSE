services:
  - type: web
    name: devpulse-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://dev-pulse-lhnv-nine.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: LOW_MEMORY_MODE
        value: "true"
